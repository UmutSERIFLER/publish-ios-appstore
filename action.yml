name: 'Publish iOS Application to Appstore'
description: 'Test, archive, sign and upload an iOS app to App Store Connect (TestFlight / App Store) with an API key.'
author: 'UmutSERIFLER'
branding:
  icon: 'upload-cloud'
  color: 'green'

inputs:
  projectName:
    description: 'Xcode project name without extension. Used as the default for `project` (<projectName>.xcodeproj) and `scheme`.'
    required: false
    default: ''
  workspace:
    description: 'Path to an .xcworkspace (e.g. CocoaPods). Takes precedence over `project`.'
    required: false
    default: ''
  project:
    description: 'Path to the .xcodeproj. Defaults to <projectName>.xcodeproj.'
    required: false
    default: ''
  scheme:
    description: 'Scheme to test and archive. Defaults to `projectName`.'
    required: false
    default: ''
  configuration:
    description: 'Build configuration used for the archive.'
    required: false
    default: 'Release'
  appstoreAPIKey:
    description: 'App Store Connect API private key: the contents of AuthKey_<id>.p8 or its base64 encoding.'
    required: true
  appstoreAPIKeyID:
    description: 'App Store Connect API key ID.'
    required: true
  appstoreAPIIssuer:
    description: 'App Store Connect API issuer ID.'
    required: true
  certificateBase64:
    description: 'Base64 of the Apple Distribution .p12 certificate. Omit to let Xcode sign automatically with the API key.'
    required: false
    default: ''
  p12FilePassword:
    description: 'Password of the .p12 certificate.'
    required: false
    default: ''
  provisionProfileBase64:
    description: 'Base64 of the App Store provisioning profile(s). Separate several profiles (app extensions) with commas or newlines.'
    required: false
    default: ''
  keychainPassword:
    description: 'Password for the temporary keychain. A random one is generated when empty.'
    required: false
    default: ''
  teamID:
    description: 'Apple Developer team ID. Sets DEVELOPMENT_TEAM for the archive; when empty, the project setting is kept and export reads it from the profile or archive.'
    required: false
    default: ''
  mobileProvision:
    description: 'Deprecated and ignored: profile names are read from provisionProfileBase64.'
    required: false
    default: ''
  buildNumber:
    description: 'CFBundleVersion to stamp on the build (sets CURRENT_PROJECT_VERSION). Defaults to github.run_number.'
    required: false
    default: ''
  version:
    description: 'CFBundleShortVersionString to stamp on the build (sets MARKETING_VERSION). Keeps the project value when empty.'
    required: false
    default: ''
  runTests:
    description: 'Run the scheme tests on a simulator before archiving.'
    required: false
    default: 'true'
  testDestination:
    description: 'xcodebuild -destination for tests. Defaults to the newest available iPhone simulator.'
    required: false
    default: ''
  exportMethod:
    description: 'ExportOptions method. Use `app-store` on Xcode older than 15.3.'
    required: false
    default: 'app-store-connect'
  validateApp:
    description: 'Validate the .ipa with App Store Connect before uploading.'
    required: false
    default: 'true'
  uploadApp:
    description: 'Upload the .ipa to App Store Connect. Set to false to only build the .ipa.'
    required: false
    default: 'true'
  gitTag:
    description: 'After a successful upload, push a git tag for the built commit. Needs `permissions: contents: write`.'
    required: false
    default: 'false'
  gitTagName:
    description: 'Tag name template for gitTag; {version} and {build} are replaced. Defaults to ios-v{version}-{build}.'
    required: false
    default: ''
  extraXcodebuildArgs:
    description: 'Extra space-separated arguments for xcodebuild test/archive, e.g. -skipMacroValidation.'
    required: false
    default: ''

outputs:
  ipaPath:
    description: 'Absolute path of the exported .ipa.'
    value: ${{ steps.export.outputs.ipaPath }}
  archivePath:
    description: 'Absolute path of the .xcarchive.'
    value: ${{ steps.archive.outputs.archivePath }}
  buildNumber:
    description: 'Build number (CFBundleVersion) read back from the archive.'
    value: ${{ steps.archive.outputs.buildNumber }}
  gitTag:
    description: 'Git tag pushed for the uploaded commit (empty unless gitTag is true).'
    value: ${{ steps.tag.outputs.gitTag }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: setup
      shell: bash
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROJECT_NAME: ${{ inputs.projectName }}
        INPUT_SCHEME: ${{ inputs.scheme }}
        INPUT_BUILD_NUMBER: ${{ inputs.buildNumber }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_MOBILE_PROVISION: ${{ inputs.mobileProvision }}
        INPUT_TEAM_ID: ${{ inputs.teamID }}
        INPUT_API_KEY: ${{ inputs.appstoreAPIKey }}
        INPUT_API_KEY_ID: ${{ inputs.appstoreAPIKeyID }}
        INPUT_API_ISSUER: ${{ inputs.appstoreAPIIssuer }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"

    - name: Install signing certificate and provisioning profiles
      id: signing
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.workDir }}
        INPUT_CERTIFICATE: ${{ inputs.certificateBase64 }}
        INPUT_P12_PASSWORD: ${{ inputs.p12FilePassword }}
        INPUT_KEYCHAIN_PASSWORD: ${{ inputs.keychainPassword }}
        INPUT_PROVISION_PROFILE: ${{ inputs.provisionProfileBase64 }}
      run: bash "$GITHUB_ACTION_PATH/scripts/signing.sh"

    - name: Run tests
      shell: bash
      env:
        CONTAINER_FLAG: ${{ steps.setup.outputs.containerFlag }}
        CONTAINER_PATH: ${{ steps.setup.outputs.containerPath }}
        SCHEME: ${{ steps.setup.outputs.scheme }}
        INPUT_RUN_TESTS: ${{ inputs.runTests }}
        INPUT_TEST_DESTINATION: ${{ inputs.testDestination }}
        INPUT_EXTRA_ARGS: ${{ inputs.extraXcodebuildArgs }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-tests.sh"

    - name: Archive
      id: archive
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.workDir }}
        CONTAINER_FLAG: ${{ steps.setup.outputs.containerFlag }}
        CONTAINER_PATH: ${{ steps.setup.outputs.containerPath }}
        SCHEME: ${{ steps.setup.outputs.scheme }}
        BUILD_NUMBER: ${{ steps.setup.outputs.buildNumber }}
        API_KEY_PATH: ${{ steps.setup.outputs.apiKeyPath }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TEAM_ID: ${{ inputs.teamID }}
        INPUT_API_KEY_ID: ${{ inputs.appstoreAPIKeyID }}
        INPUT_API_ISSUER: ${{ inputs.appstoreAPIIssuer }}
        INPUT_EXTRA_ARGS: ${{ inputs.extraXcodebuildArgs }}
      run: bash "$GITHUB_ACTION_PATH/scripts/archive.sh"

    - name: Export .ipa
      id: export
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.workDir }}
        ARCHIVE_PATH: ${{ steps.archive.outputs.archivePath }}
        API_KEY_PATH: ${{ steps.setup.outputs.apiKeyPath }}
        PROFILE_TEAM_ID: ${{ steps.signing.outputs.teamId }}
        INPUT_TEAM_ID: ${{ inputs.teamID }}
        INPUT_EXPORT_METHOD: ${{ inputs.exportMethod }}
        INPUT_API_KEY_ID: ${{ inputs.appstoreAPIKeyID }}
        INPUT_API_ISSUER: ${{ inputs.appstoreAPIIssuer }}
      run: bash "$GITHUB_ACTION_PATH/scripts/export.sh"

    - name: Validate and upload to App Store Connect
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.workDir }}
        IPA_PATH: ${{ steps.export.outputs.ipaPath }}
        INPUT_VALIDATE_APP: ${{ inputs.validateApp }}
        INPUT_UPLOAD_APP: ${{ inputs.uploadApp }}
        INPUT_API_KEY_ID: ${{ inputs.appstoreAPIKeyID }}
        INPUT_API_ISSUER: ${{ inputs.appstoreAPIIssuer }}
      run: bash "$GITHUB_ACTION_PATH/scripts/upload.sh"

    - name: Tag the uploaded commit
      id: tag
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.archive.outputs.archivePath }}
        INPUT_GIT_TAG: ${{ inputs.gitTag }}
        INPUT_GIT_TAG_NAME: ${{ inputs.gitTagName }}
        INPUT_UPLOAD_APP: ${{ inputs.uploadApp }}
      run: bash "$GITHUB_ACTION_PATH/scripts/tag.sh"

    - name: Remove signing assets and API key
      if: always()
      shell: bash
      env:
        WORK_DIR: ${{ steps.setup.outputs.workDir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/cleanup.sh"
